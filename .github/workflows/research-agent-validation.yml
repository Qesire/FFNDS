name: FFNDS research agent integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-research-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify pinned agent guidance and current goal
        run: python tools/check_autoresearcher_binding.py
      - name: Verify historical method eligibility and closed evidence
        run: |
          python tools/check_research_routes.py
          python -m unittest discover -s tests -p 'test_research_route_guard.py' -v
      - name: Exercise actual counterfactual arithmetic (synthetic inputs only)
        run: python -m unittest discover -s tests -p 'test_counterfactual_actions.py' -v
      - name: Reproduce saved-evidence R12 E0 ledger
        run: python tools/check_r12_saved_evidence.py
      - name: Verify saved R12 evidence and its interpretation boundaries
        run: |
          python tools/check_r12_e0_artifacts.py
          python tools/check_r12_d0_artifacts.py
          python -m unittest discover -s tests -p 'test_objective_contract.py' -v
          python -m unittest discover -s tests -p 'test_r12*.py' -v
          python -m unittest discover -s tests -p 'test_saved_flow_partitions.py' -v
      - name: Enforce full free-running video smoke for promoted candidate records
        run: |
          python tools/check_candidate_rollout_gate.py
          python -m unittest discover -s tests -p 'test_candidate_rollout_gate.py' -v
      - name: Verify user-updated competitive evaluation does not reopen frozen experiments
        run: python -m unittest discover -s tests -p 'test_competitive_evaluation_policy.py' -v
      - name: Verify science library provenance and non-prescriptive agent discovery
        run: python -m unittest discover -s tests -p 'test_exploration_library.py' -v
      - name: Verify worker migration provenance and exact spatial budgets
        run: |
          python -m unittest discover -s tests -p 'test_worker_identity.py' -v
          python -m unittest discover -s tests -p 'test_native_tile_layouts.py' -v
      - name: Run CLI smoke fixture
        run: |
          python tools/analyze_counterfactual_actions.py --input research/20261022/examples/counterfactual_demo.json --output /tmp/ffnds_counterfactual_smoke.json
          python -c "import json; j=json.load(open('/tmp/ffnds_counterfactual_smoke.json')); assert j['evidence_level']=='SYNTHETIC_TEST_ONLY' and abs(j['oracle_gain_over_best_fixed']-5)<1e-9"
      - name: Verify saved spatial evidence and nonlinear pooling identities
        run: |
          python tools/check_r13_artifacts.py
          python -m unittest discover -s tests -p 'test_spatial*.py' -v
      - name: Verify fused synthetic backend evidence and matched native-value analysis
        run: |
          python tools/check_r14_backend.py
          python tools/check_r14_native_value.py
          python -m unittest discover -s tests -p 'test_r14*.py' -v
          python -m unittest discover -s tests -p 'test_stripe*.py' -v
