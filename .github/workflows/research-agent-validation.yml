name: FFNDS research instructions integrity (manual, static)

# Historical automatic synthetic/experimental test queue is retired.
# No checks or experiments start from a push or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-research-source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current AutoResearcher routing and scoped experiment records
        run: python tools/check_autoresearcher_binding.py
      - name: Check paper graph and active research navigation
        run: python tests/test_graph_agent_bridge.py
      - name: Validate task dependency and authority ledger
        run: python tests/test_current_task_ledger.py
      - name: Validate signed HiF4 storage vs native QDQ observation semantics
        run: python tests/test_hif4_signed_storage_contract.py
